[project]
name = "sijil-core"
version = "0.0.0"
description = "Shared code for Sijil Python services: settings, region guard, crypto, Paperless client."
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "cryptography>=44",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sijil_core"]

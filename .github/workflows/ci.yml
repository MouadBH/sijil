name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.10.3"
  NODE_VERSION: "24"
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4.12-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy libs services fixtures
      - run: uv run pytest
        env:
          SIJIL_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/postgres
          SIJIL_TEST_REDIS_URL: redis://localhost:6379/0

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/*/playwright-report
          retention-days: 7

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env.example config -q
      - name: tessdata checksum
        run: cd infra/compose/tessdata && sha256sum -c SHA256SUMS

  integration:
    # The whole stack, then smoke, contract, DockerRuntime and M1 acceptance tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: make smoke
      - run: make itest
      - name: compose logs
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env logs --no-color --tail 200
      - if: always()
        run: make down ARGS=-v

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: pip-audit (runtime dependencies)
        run: |
          uv export --frozen --all-packages --no-dev --no-emit-workspace --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --strict --disable-pip -r /tmp/requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high
      - name: trivy filesystem scan
        run: >-
          docker run --rm -v "$PWD:/repo" ${{ env.TRIVY_IMAGE }}
          fs --scanners vuln,secret,misconfig --severity CRITICAL --exit-code 1
          --skip-dirs /repo/node_modules /repo
      - name: build service images
        run: |
          docker build -f services/control-plane/Dockerfile -t sijil-cp:ci .
          docker build -f services/worker/Dockerfile -t sijil-worker:ci .
      - name: trivy image scan
        run: |
          for image in sijil-cp:ci sijil-worker:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ${{ env.TRIVY_IMAGE }} \
              image --severity CRITICAL --exit-code 1 --ignore-unfixed "$image"
          done

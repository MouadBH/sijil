# Sijil local stack. Networks:
#   core       — our services; the only network with a route out. Only the control
#                plane publishes a port, and only on localhost.
#   ai         — internal: control plane / worker → ollama.
#   tenant_tN  — internal, one per workspace: that tenant's Paperless-ngx and its redis.
#                Shared helpers (postgres, tika, gotenberg, ollama) and the control
#                plane / worker are attached to every tenant network, so a tenant
#                reaches them but never another tenant.
#   {project}_tenant_{slug} — the same shape, created at run time by the worker's DockerRuntime
#                for every provisioned workspace (labels sijil.tenant / sijil.workspace).

x-paperless: &paperless
  image: ghcr.io/paperless-ngx/paperless-ngx:3.4.1
  restart: unless-stopped
  env_file: paperless/tenant.env
  depends_on:
    postgres: { condition: service_healthy }
    tika: { condition: service_started }
    gotenberg: { condition: service_started }
    tessdata-init: { condition: service_completed_successfully }
  healthcheck:
    test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8000/accounts/login/"]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 60s

x-sijil-env: &sijil-env
  SIJIL_REGION: ${SIJIL_REGION:?SIJIL_REGION is required}
  SIJIL_ENVIRONMENT: dev
  SIJIL_INBOUND_DOMAIN: in.sijil.local
  SIJIL_REDIS_URL: redis://redis:6379/0

# Every running service gets the least-privilege `sijil-app` key (put, read, list; no delete,
# no BypassGovernanceRetention), which `migrate` provisions. Only `migrate` and the test runner
# hold the RustFS root key.
x-objectstore-env: &objectstore-env
  SIJIL_OBJECTSTORE_ENDPOINT: http://objectstore:9000
  SIJIL_OBJECTSTORE_ACCESS_KEY: ${SIJIL_OBJECTSTORE_APP_ACCESS_KEY:?}
  SIJIL_OBJECTSTORE_SECRET_KEY: ${SIJIL_OBJECTSTORE_APP_SECRET_KEY:?}
  SIJIL_OBJECTSTORE_BUCKET: sijil-originals-${SIJIL_REGION:?SIJIL_REGION is required}

x-objectstore-root-env: &objectstore-root-env
  SIJIL_OBJECTSTORE_ENDPOINT: http://objectstore:9000
  SIJIL_OBJECTSTORE_ACCESS_KEY: ${OBJECTSTORE_ACCESS_KEY:?}
  SIJIL_OBJECTSTORE_SECRET_KEY: ${OBJECTSTORE_SECRET_KEY:?}
  SIJIL_OBJECTSTORE_BUCKET: sijil-originals-${SIJIL_REGION:?SIJIL_REGION is required}
  # The credential `sijil-cp bootstrap-storage` provisions (and the tests check).
  SIJIL_OBJECTSTORE_APP_ACCESS_KEY: ${SIJIL_OBJECTSTORE_APP_ACCESS_KEY:?}
  SIJIL_OBJECTSTORE_APP_SECRET_KEY: ${SIJIL_OBJECTSTORE_APP_SECRET_KEY:?}

x-worker-env: &worker-env
  <<: [*sijil-env, *objectstore-env]
  SIJIL_MASTER_KEY: ${SIJIL_MASTER_KEY:?}
  SIJIL_DATABASE_URL: postgresql+asyncpg://sijil_cp_app:${SIJIL_CP_APP_DB_PASSWORD:?}@postgres:5432/sijil_cp
  SIJIL_PROVISIONER_DATABASE_URL: postgresql+asyncpg://sijil_provisioner:${SIJIL_PROVISIONER_DB_PASSWORD:?}@postgres:5432/postgres
  SIJIL_TENANT_IMAGE: ghcr.io/paperless-ngx/paperless-ngx:3.4.1
  SIJIL_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-sijil}
  SIJIL_TESSDATA_VOLUME: ${COMPOSE_PROJECT_NAME:-sijil}_tessdata
  SIJIL_TENANT_SUBNET_POOL: 10.240.0.0/16

x-tenant-networks: &all-tenant-networks [tenant_t1, tenant_t2]

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SIJIL_CP_OWNER_DB_PASSWORD: ${SIJIL_CP_OWNER_DB_PASSWORD:?}
      SIJIL_CP_APP_DB_PASSWORD: ${SIJIL_CP_APP_DB_PASSWORD:?}
      SIJIL_PROVISIONER_DB_PASSWORD: ${SIJIL_PROVISIONER_DB_PASSWORD:?}
      T1_DB_PASSWORD: ${T1_DB_PASSWORD:?}
      T1_INDEX_DB_PASSWORD: ${T1_INDEX_DB_PASSWORD:?}
      T2_DB_PASSWORD: ${T2_DB_PASSWORD:?}
      T2_INDEX_DB_PASSWORD: ${T2_INDEX_DB_PASSWORD:?}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports: ["127.0.0.1:55432:5432"] # host access for integration tests only
    networks: [core, tenant_t1, tenant_t2]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:56379:6379"]
    networks: [core]

  objectstore:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECTSTORE_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${OBJECTSTORE_SECRET_KEY:?}
    volumes: [objectstore:/data]
    networks: [core]

  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    # Not on `core`: tenants can call it, so it must have no route out itself.
    networks: [ai, tenant_t1, tenant_t2]

  ollama-pull:
    # `make models`: the only Ollama process with internet, run on demand to fill the volume.
    image: ollama/ollama:0.40.13
    profiles: [models]
    entrypoint: ["sh", "-c", "ollama serve & sleep 3 && ollama pull \"$$OLLAMA_MODEL\""]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    volumes: [ollama:/root/.ollama]
    networks: [core]

  tika:
    image: apache/tika:3.3.1.0
    restart: unless-stopped
    networks: *all-tenant-networks

  gotenberg:
    image: gotenberg/gotenberg:8.37.0
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*
    networks: *all-tenant-networks

  tessdata-init:
    # One-shot: fills the `tessdata` volume with the image's own languages plus Arabic.
    # Every tenant (sample or provisioned) mounts it read-only over the image's tessdata dir,
    # because tenants have no internet to install language packs at start-up.
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.1
    restart: "no"
    network_mode: none
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - cp -a /usr/share/tesseract-ocr/5/tessdata/. /out/ && cp /seed/ara.traineddata /out/ara.traineddata && chmod -R a+rX /out
    volumes:
      - tessdata:/out
      - ./tessdata/ara.traineddata:/seed/ara.traineddata:ro

  paperless-redis-t1:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    networks: [tenant_t1]

  paperless-redis-t2:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    networks: [tenant_t2]

  paperless-t1:
    <<: *paperless
    networks: [tenant_t1]
    environment:
      PAPERLESS_DBNAME: paperless_t1
      PAPERLESS_DBUSER: paperless_t1
      PAPERLESS_DBPASS: ${T1_DB_PASSWORD:?}
      PAPERLESS_REDIS: redis://paperless-redis-t1:6379
      PAPERLESS_SECRET_KEY: ${T1_SECRET_KEY:?}
      PAPERLESS_ADMIN_USER: sijil-admin
      PAPERLESS_ADMIN_PASSWORD: ${T1_ADMIN_PASSWORD:?}
      PAPERLESS_URL: http://paperless-t1:8000
    volumes:
      - t1_data:/usr/src/paperless/data
      - t1_media:/usr/src/paperless/media
      - tessdata:/usr/share/tesseract-ocr/5/tessdata:ro

  paperless-t2:
    <<: *paperless
    networks: [tenant_t2]
    environment:
      PAPERLESS_DBNAME: paperless_t2
      PAPERLESS_DBUSER: paperless_t2
      PAPERLESS_DBPASS: ${T2_DB_PASSWORD:?}
      PAPERLESS_REDIS: redis://paperless-redis-t2:6379
      PAPERLESS_SECRET_KEY: ${T2_SECRET_KEY:?}
      PAPERLESS_ADMIN_USER: sijil-admin
      PAPERLESS_ADMIN_PASSWORD: ${T2_ADMIN_PASSWORD:?}
      PAPERLESS_URL: http://paperless-t2:8000
    volumes:
      - t2_data:/usr/src/paperless/data
      - t2_media:/usr/src/paperless/media
      - tessdata:/usr/share/tesseract-ocr/5/tessdata:ro

  migrate:
    # One-shot: schema changes run as the owner role, never as the app role.
    build:
      context: ../..
      dockerfile: services/control-plane/Dockerfile
    command: ["sh", "-c", "alembic upgrade head && sijil-cp bootstrap-storage"]
    restart: "no"
    environment:
      <<: *objectstore-root-env
      SIJIL_REGION: ${SIJIL_REGION:?SIJIL_REGION is required}
      SIJIL_ENVIRONMENT: dev
      SIJIL_MIGRATION_DATABASE_URL: postgresql+asyncpg://sijil_cp_owner:${SIJIL_CP_OWNER_DB_PASSWORD:?}@postgres:5432/sijil_cp
    networks: [core]
    depends_on:
      postgres: { condition: service_healthy }
      objectstore: { condition: service_started }

  control-plane:
    build:
      context: ../..
      dockerfile: services/control-plane/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*sijil-env, *objectstore-env]
      SIJIL_DATABASE_URL: postgresql+asyncpg://sijil_cp_app:${SIJIL_CP_APP_DB_PASSWORD:?}@postgres:5432/sijil_cp
      SIJIL_MASTER_KEY: ${SIJIL_MASTER_KEY:?}
      SIJIL_COOKIE_SECURE: "false" # dev runs over http on localhost
    ports: ["127.0.0.1:8000:8000"]
    networks: [core, ai, tenant_t1, tenant_t2]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    environment: *worker-env
    # DEV ONLY: the Docker socket lets DockerRuntime create tenant containers and networks.
    # It is root-equivalent on the host; production uses a Kubernetes runtime instead.
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    # The socket's group (0 on Docker Desktop; the host's docker group on Linux, see Makefile).
    group_add: ["${DOCKER_SOCKET_GID:-0}"]
    networks: [core, ai, tenant_t1, tenant_t2]
    depends_on:
      redis: { condition: service_started }
      postgres: { condition: service_healthy }
      tessdata-init: { condition: service_completed_successfully }

  smtp:
    # Inbound email capture (CAP-1): archives mail per workspace address. No Docker socket and
    # no tenant networks: it needs only the database, the object store and the broker.
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    command: ["sijil-smtp"]
    # Public edge: only what SmtpSettings reads. No master key, no provisioner credentials.
    environment:
      <<: [*sijil-env, *objectstore-env]
      SIJIL_DATABASE_URL: postgresql+asyncpg://sijil_cp_app:${SIJIL_CP_APP_DB_PASSWORD:?}@postgres:5432/sijil_cp
    ports: ["127.0.0.1:2525:2525"]
    networks: [core]
    depends_on:
      redis: { condition: service_started }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  beat:
    # Schedules the periodic tasks (re-attaching compose services to tenant networks).
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "sijil_worker.main", "beat", "--loglevel", "INFO", "-s", "/tmp/celerybeat-schedule"]
    environment: *worker-env
    networks: [core]
    depends_on:
      redis: { condition: service_started }

  tests:
    # `make itest`: pytest inside the tenant networks, which have no published ports.
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.tests
    profiles: [test]
    working_dir: /src
    volumes:
      - ../..:/src
      # DEV/CI ONLY: the DockerRuntime tests drive the engine and attach this runner to the
      # tenant networks they create. The socket is root on the host; never do this in production.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Root key: the store tests exercise seal and governance removal (bypass).
      <<: [*objectstore-root-env, *worker-env]
      UV_PROJECT_ENVIRONMENT: /opt/venv
      SIJIL_IT_T1_URL: http://paperless-t1:8000
      SIJIL_IT_T1_ADMIN_PASSWORD: ${T1_ADMIN_PASSWORD:?}
      SIJIL_TEST_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/postgres
      SIJIL_TEST_REDIS_URL: redis://redis:6379/15
    networks: [core, ai, tenant_t1, tenant_t2]

networks:
  core: {}
  ai:
    internal: true
  tenant_t1:
    internal: true
  tenant_t2:
    internal: true

volumes:
  postgres:
  objectstore:
  ollama:
  t1_data:
  t1_media:
  t2_data:
  t2_media:
  tessdata:

[project]
name = "sijil-worker"
version = "0.0.0"
description = "Sijil background jobs: provisioning, ingest polling, hashing, extraction, exports."
requires-python = ">=3.13,<3.14"
dependencies = [
  "sijil-core",
  "celery[redis]>=5.4",
  "docker>=7.1",
  "asyncpg>=0.30",
]

[tool.uv.sources]
sijil-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sijil_worker"]

[project]
name = "sijil-control-plane"
version = "0.0.0"
description = "Sijil control plane: auth, tenancy, ledger, retention, audit, exports."
requires-python = ">=3.13,<3.14"
dependencies = [
  "sijil-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "celery[redis]>=5.4",
]

[project.scripts]
sijil-cp = "sijil_cp.main:run"

[tool.uv.sources]
sijil-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sijil_cp"]
